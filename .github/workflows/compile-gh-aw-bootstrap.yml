name: Compile gh-aw bootstrap

on:
  push:
    branches:
      - feat/352-gh-aw-ops-audit
    paths:
      - .github/workflows/github-ops-audit.md
      - .github/workflows/compile-gh-aw-bootstrap.yml

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned gh-aw compiler
        run: |
          curl -fsSL https://github.com/github/gh-aw/releases/download/v0.88.2/linux-amd64 -o /tmp/gh-aw
          echo "f9caa10ab948ac2228ff5dbd0e5109e9a2acf820a16ccff0c4f331edbe373057  /tmp/gh-aw" | sha256sum -c -
          chmod +x /tmp/gh-aw
          /tmp/gh-aw version
      - name: Compile and strictly validate pilot
        run: |
          /tmp/gh-aw compile github-ops-audit --strict --no-check-update
          test -s .github/workflows/github-ops-audit.lock.yml
      - name: Upload compiled lock
        uses: actions/upload-artifact@v4
        with:
          name: github-ops-audit-lock
          path: .github/workflows/github-ops-audit.lock.yml
          if-no-files-found: error
