name: Validate Dashboard PR

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'Exact PR head SHA to validate when dispatched by the factory'
        required: true
        type: string
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'api/dashboard-live.js'
      - 'dashboard/**'
      - 'docs/**'
      - 'package.json'
      - 'pyproject.toml'
      - 'scripts/validate_dashboard_contract.py'
      - 'vercel.json'
      - '.pre-commit-config.yaml'
      - '.github/workflows/branch-hygiene.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/dashboard-validate.yml'
      - '.github/workflows/dashboard-release-verify.yml'
      - '.github/workflows/factory-evidence-observer.yml'
      - '.github/workflows/factory-production-recovery.yml'
      - '.github/workflows/factory-repair-agent.yml'
      - '.github/workflows/factory-autonomous-merge.yml'
      - '.github/workflows/gh-aw-sync.yml'
      - '.github/workflows/github-ops-audit.md'
      - '.github/workflows/github-ops-audit.lock.yml'
      - '.github/workflows/github-models-ops-audit.yml'
      - '.github/workflows/repository-recall-refresh.yml'
      - '.github/workflows/reusable-weekly-repo-research.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dashboard validation dependencies
        run: pip install pre-commit==4.6.2 mkdocs-material -r dashboard/requirements.txt

      - name: Validate pre-commit configuration
        run: pre-commit validate-config

      - name: Validate README resource links
        run: |
          python - <<'PY'
          from pathlib import Path
          readme = Path("README.md").read_text(encoding="utf-8")
          required = [
              "https://agent-resources-one.vercel.app/",
              "https://github.com/KAFKA2306/design",
              "(skills/kafka-evidence-ui/SKILL.md)",
              "(plugins/kafka-evidence-ui/README.md)",
          ]
          missing = [item for item in required if item not in readme]
          if missing:
              raise SystemExit(f"missing required README resource links: {missing}")
          PY

      - name: Run commit-time validation
        run: pre-commit run --all-files --hook-stage pre-commit

      - name: Build public docs
        working-directory: docs
        run: mkdocs build --strict

      - name: Verify baseline to live overlay in headless Chrome
        run: python dashboard/tests/dashboard_live_browser_e2e.py

      - name: Verify operations navigation in headless Chrome
        run: python dashboard/tests/dashboard_operations_browser_e2e.py

      - name: Signal verified dispatched head
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ inputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/dispatches" \
            --method POST \
            -f event_type='factory.validation.success' \
            -F "client_payload[head_sha]=$VERIFIED_SHA"

