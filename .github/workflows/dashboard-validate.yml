name: Validate Dashboard

on:
  pull_request:
    paths:
      - 'api/dashboard-live.js'
      - 'dashboard/**'
      - '!dashboard/data/repository-index.json'
      - 'docs/dashboard/**'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/dashboard-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'api/dashboard-live.js'
      - 'dashboard/**'
      - '!dashboard/data/repository-index.json'
      - 'docs/dashboard/**'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/dashboard-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dashboard dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Validate dashboard Python syntax
        run: python -m compileall -q dashboard

      - name: Run dashboard tests
        run: |
          set -euo pipefail
          python -m unittest discover -s dashboard/tests -p 'test_*.py' -v
          npm run test:dashboard

      - name: Verify baseline to live overlay in headless Chrome
        run: python dashboard/tests/dashboard_live_browser_e2e.py

      - name: Verify operations navigation in headless Chrome
        run: python dashboard/tests/dashboard_operations_browser_e2e.py

      - name: Verify repository operations on production dashboard
        run: python dashboard/tests/dashboard_repository_operations_production_e2e.py

      - name: Validate dashboard JavaScript syntax
        run: |
          set -euo pipefail
          for path in docs/dashboard/*.js dashboard/live-core.js api/dashboard-live.js; do
            node --check "$path"
          done
