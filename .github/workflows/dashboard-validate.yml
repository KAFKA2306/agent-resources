name: Validate Dashboard PR

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'Exact PR head SHA to validate when dispatched by the factory'
        required: true
        type: string
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'api/dashboard-live.js'
      - 'dashboard/**'
      - 'docs/**'
      - 'package.json'
      - 'pyproject.toml'
      - 'scripts/validate_dashboard_contract.py'
      - 'scripts/research_provider_comparison.py'
      - 'tests/test_research_provider_comparison.py'
      - 'vercel.json'
      - '.pre-commit-config.yaml'
      - '.github/workflows/branch-hygiene.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/dashboard-validate.yml'
      - '.github/workflows/dashboard-release-verify.yml'
      - '.github/workflows/factory-evidence-observer.yml'
      - '.github/workflows/factory-production-recovery.yml'
      - '.github/workflows/factory-repair-agent.yml'
      - '.github/workflows/factory-provider-reroute.yml'
      - '.github/workflows/factory-capability-readback.yml'
      - '.github/workflows/factory-autonomous-merge.yml'
      - '.github/workflows/factory-conflict-repair.yml'
      - '.github/workflows/factory-reflection.yml'
      - '.github/workflows/factory-oss-benchmark.yml'
      - '.github/workflows/factory-runtime-metrics.yml'
      - '.github/workflows/gh-aw-sync.yml'
      - '.github/workflows/github-ops-audit.md'
      - '.github/workflows/github-ops-audit.lock.yml'
      - '.github/workflows/github-models-ops-audit.yml'
      - '.github/workflows/repository-recall-refresh.yml'
      - '.github/workflows/reusable-weekly-repo-research.yml'

permissions:
  contents: write
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        run: pip install -e . pytest

      - name: Run dashboard contract checks
        run: python scripts/validate_dashboard_contract.py

      - name: Run Python tests
        run: pytest -q

      - name: Run CLI smoke tests
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          export AGR_HOME="$tmp_dir/home"
          export AGR_CACHE_DIR="$tmp_dir/cache"
          export AGR_CONFIG_DIR="$tmp_dir/config"
          mkdir -p "$AGR_HOME" "$AGR_CACHE_DIR" "$AGR_CONFIG_DIR"

          agr --help >/dev/null
          agr list >/dev/null
          agr config show >/dev/null
          agr skill list >/dev/null
          agr team list >/dev/null
          agr workflow list >/dev/null

      - name: Run docs contract checks
        run: |
          python scripts/validate_docs.py
          python scripts/validate_skill_catalog.py
          python scripts/validate_team_catalog.py
          python scripts/validate_workflow_catalog.py
          python scripts/validate_resource_links.py
          python scripts/validate_recall_index.py
          python scripts/validate_resource_operations.py
          python scripts/validate_dashboard_surface.py
          python scripts/validate_research_provider_comparison.py
          python scripts/validate_factory_metrics.py

      - name: Upload dashboard validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-validation-${{ github.run_id }}
          path: |
            dashboard/factory-state.json
            dashboard/research-provider-comparison.json
          if-no-files-found: warn
          retention-days: 14
