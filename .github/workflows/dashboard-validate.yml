name: Validate Dashboard PR

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'api/dashboard-live.js'
      - 'dashboard/**'
      - 'docs/**'
      - 'package.json'
      - 'pyproject.toml'
      - 'scripts/validate_dashboard_contract.py'
      - 'vercel.json'
      - '.pre-commit-config.yaml'
      - '.github/workflows/branch-hygiene.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/dashboard-validate.yml'
      - '.github/workflows/dashboard-release-verify.yml'
      - '.github/workflows/factory-evidence-observer.yml'
      - '.github/workflows/gh-aw-sync.yml'
      - '.github/workflows/github-ops-audit.md'
      - '.github/workflows/github-ops-audit.lock.yml'
      - '.github/workflows/github-models-ops-audit.yml'
      - '.github/workflows/repository-recall-refresh.yml'
      - '.github/workflows/reusable-weekly-repo-research.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate repository recall index
        run: python -m dashboard.repository_recall validate

      - name: Run dashboard tests
        run: python -m pytest -q dashboard/tests

      - name: Validate dashboard contract
        run: python scripts/validate_dashboard_contract.py
