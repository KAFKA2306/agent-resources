name: Validate Dashboard

on:
  pull_request:
    paths:
      - 'api/dashboard-live.js'
      - 'dashboard/**'
      - 'docs/dashboard/**'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/dashboard-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'api/dashboard-live.js'
      - 'dashboard/**'
      - 'docs/dashboard/**'
      - 'package.json'
      - 'vercel.json'
      - '.github/workflows/dashboard-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dashboard dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Run dashboard tests
        run: |
          set -euo pipefail
          python -m unittest discover -s dashboard/tests -p 'test_*.py' -v
          npm run test:dashboard

      - name: Validate dashboard JavaScript syntax
        run: |
          set -euo pipefail
          for path in docs/dashboard/*.js dashboard/live-core.js api/dashboard-live.js; do
            node --check "$path"
          done

      - name: Validate visual asset manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('docs/dashboard/assets/asset-manifest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('policy', {}).get('visualOnly') is not True:
              raise SystemExit('visual asset manifest must remain visual-only')
          if data.get('policy', {}).get('mutableMainHotlinksAllowed') is not False:
              raise SystemExit('mutable main hotlinks must remain disabled')
          for asset in data.get('assets', []):
              url = asset.get('sourceUrl', '')
              if '/main/' in url:
                  raise SystemExit(f'mutable main asset URL: {url}')
          print(f"visual assets: {len(data.get('assets', []))}")
          PY
