name: Skill catalog integrity

on:
  pull_request:
    paths:
      - "api/v1/**"
      - "skills/**"
      - "scripts/validate_skill_catalog.py"
      - "tests/test_validate_skill_catalog.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/skill-catalog.yml"
  push:
    branches: [main]
    paths:
      - "api/v1/**"
      - "skills/**"
      - "scripts/validate_skill_catalog.py"
      - "tests/test_validate_skill_catalog.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/skill-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install development dependencies
        run: uv sync --group dev
      - name: Lint catalog code
        run: uv run ruff check scripts/validate_skill_catalog.py tests/test_validate_skill_catalog.py
      - name: Run catalog tests
        run: uv run pytest -q tests/test_validate_skill_catalog.py
      - name: Validate published API
        run: uv run python scripts/validate_skill_catalog.py
