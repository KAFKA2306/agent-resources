name: Deterministic Ops Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-models-ops-audit.yml'

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read

concurrency:
  group: deterministic-ops-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect and evaluate current GitHub evidence
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "KAFKA2306-autonomous-factory",
          }

          def get(path):
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}{path}", headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          issue_numbers = [297, 319, 340, 352, 359, 363, 381, 384]
          issues = {}
          for number in issue_numbers:
              item = get(f"/issues/{number}")
              issues[number] = {
                  "state": item.get("state"),
                  "title": item.get("title"),
                  "updated_at": item.get("updated_at"),
              }

          pulls = get("/pulls?state=open&per_page=50")
          runs = get("/actions/runs?per_page=30").get("workflow_runs", [])

          invariants = {
              "factory_epic_open": issues[381]["state"] == "open",
              "legacy_model_failure_closed": issues[384]["state"] == "closed",
              "human_input_centralized": issues[359]["state"] == "open",
              "legacy_ops_epic_not_active": issues[352]["state"] == "closed",
          }

          failed = [name for name, ok in invariants.items() if not ok]
          if failed:
              raise SystemExit("factory invariant failure: " + ",".join(failed))

          stale_model_prs = [
              pr["number"]
              for pr in pulls
              if pr["number"] in {379, 380}
          ]

          evidence = {
              "repository": repo,
              "revision": os.environ["GITHUB_SHA"],
              "invariants": invariants,
              "stale_model_prs": stale_model_prs,
              "recent_failures": [
                  {
                      "id": run.get("id"),
                      "name": run.get("name"),
                      "conclusion": run.get("conclusion"),
                      "head_sha": run.get("head_sha"),
                  }
                  for run in runs
                  if run.get("conclusion") == "failure"
              ][:10],
          }

          summary = (
              "deterministic audit PASS; GitHub API evidence collected; "
              f"stale_model_prs={stale_model_prs}; "
              "no LLM provider is required for this control loop"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("summary<<EOF\n")
              handle.write(summary)
              handle.write("\nEOF\n")
              handle.write("evidence<<EOF\n")
              handle.write(json.dumps(evidence, ensure_ascii=False, separators=(",", ":")))
              handle.write("\nEOF\n")
          print(summary)
          PY

      - name: Publish PASS proof to issue 363
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVISION: ${{ github.sha }}
          SUMMARY: ${{ steps.audit.outputs.summary }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          body = (
              "Deterministic Ops Audit runtime proof: PASS\n\n"
              f"- run: {os.environ['RUN_URL']}\n"
              f"- revision: `{os.environ['REVISION']}`\n"
              "- provider dependency: none\n"
              "- authority: current GitHub API + repository state\n"
              f"- summary: {os.environ['SUMMARY']}\n\n"
              "This supersedes both the Copilot model route and the retired GitHub Models route for routine ops-audit control."
          )
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/363/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "KAFKA2306-autonomous-factory",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit(f"proof comment failed: HTTP {response.status}")
          PY

      - name: Publish FAIL proof to issue 363
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          body = (
              "Deterministic Ops Audit runtime proof: FAIL\n\n"
              f"- run: {os.environ['RUN_URL']}\n"
              f"- revision: `{os.environ['REVISION']}`\n"
              "- provider dependency: none\n"
              "- inspect the failed deterministic evidence/invariant step; no success is claimed"
          )
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/363/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "KAFKA2306-autonomous-factory",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit(f"failure proof comment failed: HTTP {response.status}")
          PY
