name: GitHub Models Ops Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/github-models-ops-audit.yml'

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: read
  models: read

concurrency:
  group: github-models-ops-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Collect bounded current evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "KAFKA2306-autonomous-factory",
          }

          def get(path):
              req = urllib.request.Request(f"https://api.github.com/repos/{repo}{path}", headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          issue_numbers = [297, 319, 340, 352, 359, 363, 381, 384]
          issues = []
          for number in issue_numbers:
              item = get(f"/issues/{number}")
              issues.append(
                  {
                      "number": number,
                      "state": item.get("state"),
                      "title": item.get("title"),
                      "updated_at": item.get("updated_at"),
                  }
              )

          pulls = get("/pulls?state=open&per_page=20")
          runs = get("/actions/runs?per_page=20").get("workflow_runs", [])
          evidence = {
              "repository": repo,
              "revision": os.environ["GITHUB_SHA"],
              "issues": issues,
              "open_pull_requests": [
                  {
                      "number": item.get("number"),
                      "title": item.get("title"),
                      "head": item.get("head", {}).get("sha"),
                  }
                  for item in pulls
              ],
              "recent_workflow_runs": [
                  {
                      "id": item.get("id"),
                      "name": item.get("name"),
                      "status": item.get("status"),
                      "conclusion": item.get("conclusion"),
                      "head_sha": item.get("head_sha"),
                  }
                  for item in runs[:10]
              ],
          }
          payload = json.dumps(evidence, ensure_ascii=False, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("payload<<EOF\n")
              handle.write(payload)
              handle.write("\nEOF\n")
          PY

      - name: Analyze evidence with GitHub Models
        id: inference
        uses: actions/ai-inference@a7805884c80886efc241e94a5351df715968a0ad # v2.1.1
        with:
          model: openai/gpt-4o
          system-prompt: |
            You are a bounded software-factory verifier. Use only the supplied evidence.
            Do not invent repository state. Return exactly two lines:
            STATUS: VERIFIED
            SUMMARY: <one concise sentence describing the most important current operational fact>
          prompt: |
            Current GitHub evidence:
            ${{ steps.evidence.outputs.payload }}

      - name: Validate inference proof
        env:
          RESPONSE: ${{ steps.inference.outputs.response }}
        shell: bash
        run: |
          python - <<'PY'
          import os

          response = os.environ.get("RESPONSE", "").strip()
          if not response:
              raise SystemExit("GitHub Models returned an empty response")
          if "STATUS: VERIFIED" not in response:
              raise SystemExit(f"unexpected verifier response: {response[:1000]}")
          print(response)
          PY

      - name: Publish runtime proof to issue 363
        env:
          GH_TOKEN: ${{ github.token }}
          RESPONSE: ${{ steps.inference.outputs.response }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          response = os.environ["RESPONSE"].strip()
          body = (
              "GitHub Models runtime proof: PASS\n\n"
              f"- run: {os.environ['RUN_URL']}\n"
              f"- revision: `{os.environ['REVISION']}`\n"
              "- provider path: GitHub Models via `models: read` and repository `GITHUB_TOKEN`\n"
              "- no Copilot subscription route used\n\n"
              f"{response}"
          )
          data = json.dumps({"body": body}).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/363/comments",
              data=data,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "KAFKA2306-autonomous-factory",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response_obj:
              if response_obj.status != 201:
                  raise SystemExit(f"comment publish failed: HTTP {response_obj.status}")
          PY

      - name: Publish failed runtime proof to issue 363
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          body = (
              "GitHub Models runtime proof: FAIL\n\n"
              f"- run: {os.environ['RUN_URL']}\n"
              f"- revision: `{os.environ['REVISION']}`\n"
              "- provider path: GitHub Models via `models: read` and repository `GITHUB_TOKEN`\n"
              "- inspect the failed Actions step; no success is claimed"
          )
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/363/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "KAFKA2306-autonomous-factory",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response_obj:
              if response_obj.status != 201:
                  raise SystemExit(f"failure comment publish failed: HTTP {response_obj.status}")
          PY
