name: Sync gh-aw lock files

on:
  pull_request:
    paths:
      - '.github/workflows/*.md'

permissions:
  contents: write

jobs:
  compile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Install pinned gh-aw compiler
        run: gh extension install github/gh-aw --pin v0.88.2

      - name: Compile agentic workflows
        run: gh aw compile --strict

      - name: Commit generated lock files when changed
        shell: bash
        run: |
          if git diff --quiet -- '.github/workflows/*.lock.yml'; then
            echo "gh-aw lock files are already synchronized"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '.github/workflows/*.lock.yml'
          git commit -m "chore: sync gh-aw lock files"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
