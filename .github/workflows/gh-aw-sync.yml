name: Sync gh-aw lock files

on:
  pull_request:
    paths:
      - '.github/workflows/*.md'

permissions:
  contents: write

jobs:
  compile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create short-lived workflow writer token
        id: app-token
        if: vars.FACTORY_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: agent-resources
          permission-contents: write
          permission-workflows: write

      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: true

      - name: Install pinned gh-aw compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.88.2

      - name: Compile agentic workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile --strict

      - name: Preserve compiled lock files
        uses: actions/upload-artifact@v7
        with:
          name: gh-aw-compiled-locks
          path: .github/workflows/*.lock.yml
          if-no-files-found: error

      - name: Commit generated lock files when changed
        shell: bash
        run: |
          if git diff --quiet -- '.github/workflows/*.lock.yml'; then
            echo "gh-aw lock files are already synchronized"
            exit 0
          fi

          if [ -z "${{ steps.app-token.outputs.token }}" ]; then
            echo "::error::Compiled lock files changed, but FACTORY_APP_ID / FACTORY_APP_PRIVATE_KEY are not configured. Bootstrap the short-lived GitHub App writer described in agent-resources#359."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '.github/workflows/*.lock.yml'
          git commit -m "chore: sync gh-aw lock files"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
