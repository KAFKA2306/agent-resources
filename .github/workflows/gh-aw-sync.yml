name: Sync gh-aw lock files

on:
  pull_request:
    paths:
      - '.github/workflows/*.md'

permissions:
  contents: write

jobs:
  compile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create short-lived workflow writer token
        id: app-token
        if: vars.FACTORY_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: agent-resources
          permission-contents: write
          permission-workflows: write

      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: true

      - name: Install pinned gh-aw compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.88.2

      - name: Compile agentic workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile --strict

      - name: Verify retired ops audit stays manual-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('.github/workflows/github-ops-audit.lock.yml')
          data = yaml.safe_load(path.read_text())
          triggers = data.get(True, data.get('on', {}))
          if not isinstance(triggers, dict):
              raise SystemExit(f'unexpected trigger structure: {triggers!r}')
          forbidden = sorted(set(triggers) - {'workflow_dispatch'})
          if forbidden:
              raise SystemExit(f'retired ops audit is not manual-only; forbidden triggers: {forbidden}')
          if 'workflow_dispatch' not in triggers:
              raise SystemExit('retired ops audit lost workflow_dispatch trigger')
          print('github-ops-audit.lock.yml is manual-only')
          PY

      - name: Record compiled lock handoff manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="gh-aw-compiled-locks.sha256"
          sha256sum .github/workflows/*.lock.yml > "$manifest"
          {
            echo '## gh-aw compiled lock handoff'
            echo
            echo "source_head=${{ github.event.pull_request.head.sha }}"
            echo '```text'
            cat "$manifest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve compiled lock files
        uses: actions/upload-artifact@v7
        with:
          name: gh-aw-compiled-locks
          path: |
            .github/workflows/*.lock.yml
            gh-aw-compiled-locks.sha256
          if-no-files-found: error

      - name: Commit generated lock files when changed
        shell: bash
        run: |
          if git diff --quiet -- '.github/workflows/*.lock.yml'; then
            echo "gh-aw lock files are already synchronized"
            exit 0
          fi

          if [ -z "${{ steps.app-token.outputs.token }}" ]; then
            echo "::error::Compiled lock files changed, but FACTORY_APP_ID / FACTORY_APP_PRIVATE_KEY are not configured. Bootstrap the short-lived GitHub App writer described in agent-resources#359."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '.github/workflows/*.lock.yml'
          git commit -m "chore: sync gh-aw lock files"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
