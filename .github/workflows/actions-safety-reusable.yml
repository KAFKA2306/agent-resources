name: GitHub Actions safety reusable

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actions-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Reject newly introduced unsafe workflow patterns
        shell: bash
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "${zero}" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            head="HEAD"
          fi

          git diff --unified=0 "${base}" "${head}" -- '.github/workflows/*.yml' '.github/workflows/*.yaml' > /tmp/workflows.diff || true

          python - <<'PY'
          import re
          from pathlib import Path

          violations = []
          sha40 = re.compile(r'^[0-9a-fA-F]{40}$')
          uses_re = re.compile(r'\buses:\s*([^\s#]+)')

          for raw in Path('/tmp/workflows.diff').read_text(encoding='utf-8', errors='replace').splitlines():
              if not raw.startswith('+') or raw.startswith('+++'):
                  continue
              line = raw[1:].strip()
              if not line or line.startswith('#'):
                  continue

              if re.search(r'(^|\s)pull_request_target\s*:', line):
                  violations.append(('pull_request_target requires explicit review', line))
              if re.search(r'permissions\s*:\s*write-all\b', line):
                  violations.append(('write-all permissions are forbidden', line))
              if re.search(r'secrets\s*:\s*inherit\b', line):
                  violations.append(('secrets: inherit requires explicit review', line))

              match = uses_re.search(line)
              if match:
                  target = match.group(1)
                  if target.startswith('./'):
                      continue
                  if target.startswith('docker://'):
                      continue
                  if '@' not in target:
                      violations.append(('action/reusable workflow must use an immutable commit SHA', line))
                      continue
                  ref = target.rsplit('@', 1)[1]
                  if not sha40.fullmatch(ref):
                      violations.append(('action/reusable workflow must be pinned to a 40-char commit SHA', line))

          if violations:
              print('Unsafe GitHub Actions changes detected:')
              for reason, line in violations:
                  print(f'- {reason}: {line}')
              raise SystemExit(1)

          print('No newly introduced unsafe GitHub Actions patterns found.')
          PY
