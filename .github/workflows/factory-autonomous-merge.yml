name: Factory Autonomous Merge

on:
  repository_dispatch:
    types:
      - factory.validation.success
  workflow_run:
    workflows:
      - Validate Dashboard PR
    types:
      - completed

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: factory-automerge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event_name == 'repository_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve exact-head pull request and fail closed
        id: gate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const headSha = context.eventName === 'repository_dispatch'
              ? context.payload.client_payload?.head_sha
              : context.payload.workflow_run.head_sha;
            if (!headSha) {
              core.setFailed('verified head SHA is missing');
              return;
            }
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: headSha,
            });
            const candidates = pulls.filter(pr =>
              pr.state === 'open' &&
              pr.base.ref === context.payload.repository.default_branch &&
              pr.head.sha === headSha &&
              !pr.draft
            );
            if (candidates.length === 0) {
              core.notice(`no eligible open non-draft PR for exact head ${headSha}; autonomous merge is a no-op`);
              core.setOutput('eligible', 'false');
              return;
            }
            if (candidates.length !== 1) {
              core.setFailed(`expected at most one open non-draft PR for exact head ${headSha}; found ${candidates.length}`);
              return;
            }
            const candidate = candidates[0];
            let pr = null;
            for (let attempt = 0; attempt < 6; attempt += 1) {
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: candidate.number,
              });
              pr = response.data;
              if (pr.head.sha !== headSha || pr.state !== 'open' || pr.draft) {
                core.setFailed('PR changed while claiming mergeability; refusing stale repair or merge');
                return;
              }
              if (pr.mergeable !== null) break;
              if (attempt < 5) {
                core.notice(`PR #${pr.number} mergeability is pending; bounded read-back ${attempt + 1}/6`);
                await new Promise(resolve => setTimeout(resolve, 3000));
              }
            }
            if (pr.mergeable === false) {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'factory-conflict-repair.yml',
                ref: context.payload.repository.default_branch,
                inputs: {
                  pr_number: String(pr.number),
                  expected_head_sha: headSha,
                  expected_base_sha: pr.base.sha,
                },
              });
              core.notice(`dispatched bounded conflict repair for PR #${pr.number} head=${headSha} base=${pr.base.sha}`);
              core.setOutput('eligible', 'false');
              return;
            }
            if (pr.mergeable == null) {
              core.setFailed('PR mergeability remained unknown after bounded read-back; refusing optimistic merge');
              return;
            }
            const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
            });
            const blockers = combined.statuses.filter(status =>
              status.state !== 'success' &&
              status.context !== 'Vercel'
            );
            const vercel = combined.statuses.find(status => status.context === 'Vercel');
            if (!vercel || vercel.state !== 'success') {
              core.setFailed(`exact-head Vercel status is ${vercel?.state || 'missing'}`);
              return;
            }
            if (blockers.length) {
              core.setFailed(`exact-head commit statuses are not green: ${blockers.map(x => x.context + ':' + x.state).join(',')}`);
              return;
            }

            // A successful repository_dispatch is emitted only by the dispatched
            // validator after it checked out and validated the requested exact PR
            // head. That workflow run is anchored to main, so its run.head_sha is
            // not the validated PR SHA and cannot be found by a head_sha filter.
            if (context.eventName === 'repository_dispatch') {
              core.notice(`repository_dispatch confirms successful exact-head dispatched validation for ${headSha}`);
            } else {
              // Workflow-level failures can exist without a check_run (for example a
              // workflow startup/configuration failure). For native pull_request
              // validation, fail closed until every exact-head run settles green.
              let validationRunsReady = false;
              for (let attempt = 0; attempt < 30; attempt += 1) {
                const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head_sha: headSha,
                  per_page: 100,
                });
                const validations = (workflowRuns.workflow_runs || []).filter(run =>
                  run.name === 'Validate Dashboard PR' &&
                  run.event === 'pull_request'
                );
                if (!validations.length) {
                  core.setFailed(`no Validate Dashboard PR workflow runs found for exact head ${headSha}`);
                  return;
                }
                const failed = validations.filter(run =>
                  run.status === 'completed' && run.conclusion !== 'success'
                );
                if (failed.length) {
                  core.setFailed(
                    `exact-head validation workflow failed: ${failed.map(run => run.id + ':' + run.event + ':' + run.conclusion).join(',')}`
                  );
                  return;
                }
                const pending = validations.filter(run => run.status !== 'completed');
                if (!pending.length) {
                  validationRunsReady = true;
                  core.notice(`all ${validations.length} exact-head validation workflow runs are successful`);
                  break;
                }
                if (attempt === 29) {
                  core.setFailed(
                    `exact-head validation workflow runs did not settle: ${pending.map(run => run.id + ':' + run.status).join(',')}`
                  );
                  return;
                }
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
              if (!validationRunsReady) {
                core.setFailed('exact-head validation workflow verification did not complete');
                return;
              }
            }

            const acceptedConclusions = new Set(['success', 'neutral', 'skipped']);
            let checksReady = false;
            for (let attempt = 0; attempt < 30; attempt += 1) {
              const { data: checks } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
                filter: 'latest',
                per_page: 100,
              });
              const runs = checks.check_runs || [];
              if (!runs.length) {
                core.setFailed(`no exact-head check runs found for ${headSha}`);
                return;
              }
              const failed = runs.filter(run =>
                run.status === 'completed' && !acceptedConclusions.has(run.conclusion)
              );
              if (failed.length) {
                core.setFailed(
                  `exact-head checks failed: ${failed.map(run => run.name + ':' + run.conclusion).join(',')}`
                );
                return;
              }
              const pending = runs.filter(run => run.status !== 'completed');
              if (!pending.length) {
                checksReady = true;
                core.notice(`all ${runs.length} exact-head check runs are green`);
                break;
              }
              if (attempt === 29) {
                core.setFailed(
                  `exact-head checks did not settle: ${pending.map(run => run.name + ':' + run.status).join(',')}`
                );
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            if (!checksReady) {
              core.setFailed('exact-head check verification did not complete');
              return;
            }
            core.setOutput('eligible', 'true');
            core.setOutput('number', String(pr.number));
            core.setOutput('head_sha', headSha);

      - name: Merge verified exact head
        if: steps.gate.outputs.eligible == 'true'
        id: merge
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PR_NUMBER: ${{ steps.gate.outputs.number }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const pull_number = Number(process.env.PR_NUMBER);
            const expected = process.env.HEAD_SHA;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
            });
            if (pr.state !== 'open' || pr.draft || pr.head.sha !== expected) {
              core.setFailed('PR changed after verification; refusing autonomous merge');
              return;
            }
            const result = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number,
              sha: expected,
              merge_method: 'squash',
            });
            if (!result.data.merged) {
              core.setFailed(`merge refused: ${result.data.message}`);
              return;
            }
            core.notice(`autonomously merged PR #${pull_number} at exact head ${expected}`);
            core.setOutput('merge_sha', result.data.sha);
            core.setOutput('pr_number', String(pull_number));

      - name: Dispatch Pages current-evidence refresh
        if: steps.gate.outputs.eligible == 'true' && steps.merge.conclusion == 'success'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          MERGE_SHA: ${{ steps.merge.outputs.merge_sha }}
          PR_NUMBER: ${{ steps.merge.outputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const mainSha = process.env.MERGE_SHA;
            if (!mainSha) {
              core.setFailed('merge SHA is missing; refusing Pages refresh dispatch');
              return;
            }
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'factory.pages.refresh',
              client_payload: {
                main_sha: mainSha,
                pr_number: process.env.PR_NUMBER || '',
                source: 'factory-autonomous-merge',
              },
            });
            core.notice(`dispatched Pages refresh for merged main ${mainSha}`);
