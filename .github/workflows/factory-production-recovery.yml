name: Factory Production Recovery

on:
  workflow_run:
    workflows:
      - Verify Dashboard Release
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: factory-production-recovery
  cancel-in-progress: false

jobs:
  fix-forward-revert:
    # Only deployment-backed verification is authoritative enough to trigger
    # production recovery. The gate below additionally proves that the failed
    # revision changed code capable of causing the observed production class.
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 2

      - name: Resolve failed production revision and fail closed
        id: gate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const failedRun = context.payload.workflow_run;
            const failedSha = failedRun.head_sha;
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const { data: main } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: repo.default_branch,
            });
            if (main.sha !== failedSha) {
              core.setFailed(`production failure revision ${failedSha} is no longer current main ${main.sha}; refusing stale recovery`);
              return;
            }
            if ((main.parents || []).length !== 1) {
              core.setFailed('current main is not a single-parent commit; refusing automatic revert');
              return;
            }
            if ((main.commit?.message || '').startsWith('factory: revert production failure')) {
              core.setFailed('bounded production recovery already attempted; refusing revert oscillation');
              return;
            }

            const parentSha = main.parents[0].sha;
            const { data: comparison } = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: parentSha,
              head: failedSha,
            });
            const changed = (comparison.files || []).map(file => file.filename);
            const productionRelevant = changed.some(path =>
              path === 'dashboard/index.html' ||
              path.startsWith('dashboard/assets/') ||
              path.startsWith('dashboard/js/') ||
              path.startsWith('dashboard/css/') ||
              path.startsWith('scripts/verify_production') ||
              path === '.github/workflows/dashboard-release-verify.yml'
            );
            if (!productionRelevant) {
              core.notice(`production verification failed, but ${failedSha} changed no production-relevant files: ${changed.join(', ')}`);
              core.setOutput('recover', 'false');
              return;
            }

            core.setOutput('recover', 'true');
            core.setOutput('failed_sha', failedSha);
            core.setOutput('parent_sha', parentSha);
            core.setOutput('run_id', String(failedRun.id));

      - name: Create isolated fix-forward revert
        if: steps.gate.outputs.recover == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_SHA: ${{ steps.gate.outputs.failed_sha }}
          FAILED_RUN_ID: ${{ steps.gate.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          branch="factory/recover-${FAILED_SHA:0:12}"
          git config user.name "factory-recovery[bot]"
          git config user.email "factory-recovery@users.noreply.github.com"
          git switch -c "$branch"
          git revert --no-edit "$FAILED_SHA"
          git commit --amend -m "factory: revert production failure ${FAILED_SHA:0:12}"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "factory: recover production from ${FAILED_SHA:0:12}" \
            --body "Automatic fix-forward generated from failed production verification run ${FAILED_RUN_ID}. Reverts exact current-main revision \`${FAILED_SHA}\`. This PR must pass the normal exact-head validation + Vercel gate and is then merged by Factory Autonomous Merge."
          recovery_sha="$(git rev-parse HEAD)"
          gh workflow run dashboard-validate.yml --ref "$branch" -f head_sha="$recovery_sha"
