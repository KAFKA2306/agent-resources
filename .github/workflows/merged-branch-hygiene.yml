name: Cleanup non-default branches with archive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: branch-hygiene-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Archive branch heads before removing refs
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const fullName = `${owner}/${repo}`;
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            const defaultBranch = repository.default_branch;
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100,
            });
            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const openHeads = new Set(openPulls
              .filter(pr => pr.head.repo?.full_name === fullName)
              .map(pr => pr.head.ref));
            const deleted = [];
            const kept = [];

            for (const branch of branches) {
              const name = branch.name;
              if (name === defaultBranch) continue;
              if (branch.protected || openHeads.has(name)) {
                kept.push(`${name}: protected or open pull request`);
                continue;
              }

              // Re-read the head: never archive a stale snapshot and delete a changed branch.
              const { data: current } = await github.rest.repos.getBranch({
                owner, repo, branch: name,
              });
              if (current.protected || current.commit.sha !== branch.commit.sha) {
                kept.push(`${name}: protected or changed since listing`);
                continue;
              }

              const headSha = current.commit.sha;
              // A ref to the original SHA preserves even unmerged work without
              // introducing a second long-lived branch or changing main.
              const archiveName = `branch-archive/${name}/${headSha.slice(0, 12)}`;
              try {
                await github.rest.git.createRef({
                  owner, repo, ref: `refs/tags/${archiveName}`, sha: headSha,
                });
              } catch (error) {
                if (error.status !== 422) throw error;
                const { data: existing } = await github.rest.git.getRef({
                  owner, repo, ref: `tags/${archiveName}`,
                });
                if (existing.object.sha !== headSha) {
                  throw new Error(`archive tag SHA mismatch for ${name}`);
                }
              }

              // An open PR created since the initial listing must retain its head.
              const { data: livePulls } = await github.rest.pulls.list({
                owner, repo, head: `${owner}:${name}`, state: 'open', per_page: 1,
              });
              if (livePulls.length) {
                kept.push(`${name}: open pull request created during cleanup`);
                continue;
              }
              const { data: latest } = await github.rest.repos.getBranch({
                owner, repo, branch: name,
              });
              if (latest.protected || latest.commit.sha !== headSha) {
                kept.push(`${name}: protected or updated during cleanup`);
                continue;
              }
              await github.rest.git.deleteRef({
                owner, repo, ref: `heads/${name}`,
              });
              deleted.push(`${name} -> refs/tags/${archiveName} (${headSha})`);
            }
            core.summary.addHeading('Single-default-branch cleanup');
            core.summary.addRaw(`Default: ${defaultBranch}; removed: ${deleted.length}; kept: ${kept.length}\n\n`);
            for (const line of deleted) core.summary.addRaw(`- archived and deleted: ${line}\n`);
            for (const line of kept) core.summary.addRaw(`- kept: ${line}\n`);
            await core.summary.write();
            core.info(`Removed ${deleted.length} non-default branches; kept ${kept.length}.`);
