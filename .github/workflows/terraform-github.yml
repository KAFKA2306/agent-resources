name: Terraform GitHub Drift

on:
  pull_request:
    paths:
      - 'infra/github/**'
      - '.github/workflows/terraform-github.yml'
  push:
    branches: [main]
    paths:
      - 'infra/github/**'
      - '.github/workflows/terraform-github.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-github-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Read live GitHub merge settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          squash="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.allow_squash_merge')"
          test "$squash" = "true" || {
            echo "allow_squash_merge is not true"
            exit 1
          }
          echo "TF_VAR_allow_squash_merge=$squash" >> "$GITHUB_ENV"

      - name: Check Terraform formatting
        run: terraform -chdir=infra/github fmt -check -recursive

      - name: Initialize Terraform
        run: terraform -chdir=infra/github init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform -chdir=infra/github validate

      - name: Verify live GitHub control-plane contract
        run: terraform -chdir=infra/github plan -refresh=true -input=false -lock=false -no-color
