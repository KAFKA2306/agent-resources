name: Factory Capability Readback

on:
  workflow_run:
    workflows:
      - Validate Dashboard PR
      - Factory Repair Agent
      - Factory Provider Reroute
      - Factory Autonomous Merge
      - Factory Post-Merge Release Verify
      - Factory Production Recovery
      - Factory Evidence Observer
      - Factory Runtime Metrics
      - Factory Reflection
      - Sync gh-aw lock files
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Failed workflow run to read back
        required: true
        type: string
      source_head_sha:
        description: Exact failed revision expected for the source run
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  readback:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'action_required' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read back exact workflow capability evidence
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SOURCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_head_sha || github.event.workflow_run.head_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const runId = Number(process.env.SOURCE_RUN_ID);
            const expectedSha = process.env.SOURCE_HEAD_SHA;
            if (!runId || !expectedSha) {
              core.setFailed('permission readback evidence is incomplete'); return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            if (!['action_required', 'failure'].includes(run.conclusion)) {
              core.setFailed(`source run ${runId} is not a permission-capable failure: ${run.conclusion}`); return;
            }
            if (run.head_sha !== expectedSha) {
              core.setFailed(`stale permission readback: ${run.head_sha} != ${expectedSha}`); return;
            }
            const workflowPath = run.path;
            if (!workflowPath) {
              core.setFailed('source workflow path is unavailable'); return;
            }

            let permissionFingerprint = run.conclusion === 'action_required';
            let failedSteps = [];
            if (run.conclusion === 'failure') {
              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              });
              failedSteps = jobs.jobs
                .flatMap(job => job.steps || [])
                .filter(step => step.conclusion === 'failure')
                .map(step => step.name || '');
              permissionFingerprint = failedSteps.some(name =>
                /permission|authorization|commit generated lock|commit generated workflow/i.test(name)
              );
            }
            if (!permissionFingerprint) {
              core.notice(`NO_WORK: source run ${runId} has no permission-mismatch fingerprint`);
              return;
            }

            const normalizedPath = workflowPath.replace(/^\.github\/workflows\//, '');
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: `.github/workflows/${normalizedPath}`,
              ref: expectedSha,
            });
            if (Array.isArray(file) || !file.content) {
              core.setFailed('source workflow content is unavailable'); return;
            }
            const source = Buffer.from(file.content, file.encoding || 'base64').toString('utf8');
            const hasPermissions = /^permissions:/m.test(source);
            const evidence = {
              source_run_id: runId,
              source_head_sha: expectedSha,
              source_workflow: workflowPath,
              source_event: run.event,
              source_conclusion: run.conclusion,
              failed_steps: failedSteps,
              permission_fingerprint: permissionFingerprint,
              workflow_permissions_declared: hasPermissions,
            };
            await core.summary
              .addHeading('Factory Capability Readback')
              .addCodeBlock(JSON.stringify(evidence, null, 2), 'json')
              .write();
            if (!hasPermissions) {
              core.setFailed('source workflow has no explicit permissions block');
            }
