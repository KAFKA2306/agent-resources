name: Factory Runtime Metrics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/factory-runtime-metrics.yml"
      - ".github/workflows/factory-*.yml"
      - "dashboard/factory_*.py"
      - "dashboard/collectors/factory_evidence.py"
  pull_request:
    paths:
      - ".github/workflows/factory-runtime-metrics.yml"
  workflow_run:
    workflows:
      - "Factory Self-Heal Pilot"
      - "Verify Dashboard Release"
    types:
      - completed
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: factory-runtime-metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect queue, lead, repair, deploy-to-probe, self-heal, and failure Pareto timing from GitHub Actions
        id: metrics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import statistics
          import urllib.request
          from collections import Counter
          from datetime import datetime

          repo = os.environ["GH_REPOSITORY"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          payload = api_json(f"https://api.github.com/repos/{repo}/actions/runs?branch=main&per_page=100")
          runs = payload.get("workflow_runs")
          if not isinstance(runs, list):
              raise SystemExit("workflow_runs evidence is missing")

          def parse(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          def is_machine_triggered(run):
              actor = run.get("triggering_actor") or {}
              login = actor.get("login") or ""
              return actor.get("type") == "Bot" or login.endswith("[bot]")

          queue_seconds = []
          lead_seconds = []
          repair_seconds = []
          deploy_probe_seconds = []
          failure_counts = Counter()
          cancellation_counts = Counter()
          skipped_counts = Counter()
          completed_count = 0
          first_pass_eligible_count = 0
          first_pass_success_count = 0
          self_heal_attempt_count = 0
          self_heal_success_count = 0
          self_heal_unknown_count = 0
          human_rerun_count = 0
          for run in runs:
              created = run.get("created_at")
              started = run.get("run_started_at")
              updated = run.get("updated_at")
              if created and started:
                  queue_seconds.append(max(0.0, (parse(started) - parse(created)).total_seconds()))
              if created and updated and run.get("status") == "completed":
                  completed_count += 1
                  duration = max(0.0, (parse(updated) - parse(created)).total_seconds())
                  lead_seconds.append(duration)
                  if run.get("name") == "Factory Repair Agent":
                      repair_seconds.append(duration)

                  first_attempt = run
                  is_rerun = (run.get("run_attempt") or 1) > 1
                  if is_rerun:
                      run_id = run.get("id")
                      if not run_id:
                          raise SystemExit("rerun is missing run id")
                      first_attempt = api_json(
                          f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/attempts/1"
                      )
                      if first_attempt.get("status") != "completed":
                          raise SystemExit(f"first attempt evidence is incomplete for run {run_id}")

                  conclusion = first_attempt.get("conclusion")
                  workflow_name = run.get("name") or "UNKNOWN_WORKFLOW"
                  if conclusion == "cancelled":
                      cancellation_counts[workflow_name] += 1
                  elif conclusion == "skipped":
                      skipped_counts[workflow_name] += 1
                  else:
                      first_pass_eligible_count += 1
                      if conclusion in {"success", "neutral"}:
                          first_pass_success_count += 1
                      else:
                          failure_counts[(workflow_name, conclusion or "UNKNOWN")] += 1
                          if is_rerun:
                              if not is_machine_triggered(run):
                                  human_rerun_count += 1
                              elif conclusion is None:
                                  self_heal_unknown_count += 1
                              else:
                                  self_heal_attempt_count += 1
                                  if run.get("conclusion") in {"success", "neutral"}:
                                      self_heal_success_count += 1

              name = run.get("name") or ""
              head_commit = run.get("head_commit") or {}
              commit_timestamp = head_commit.get("timestamp")
              is_production_verifier = (
                  name.startswith("Dashboard release · production")
                  or name.startswith("Dashboard release · manual ·")
              )
              if (
                  is_production_verifier
                  and run.get("status") == "completed"
                  and run.get("conclusion") == "success"
                  and commit_timestamp
                  and updated
              ):
                  deploy_probe_seconds.append(
                      max(0.0, (parse(updated) - parse(commit_timestamp)).total_seconds())
                  )

          if not queue_seconds:
              raise SystemExit("no observed queue timing evidence")
          if not lead_seconds:
              raise SystemExit("no observed completed workflow lead timing evidence")

          def nearest_rank(values, p):
              ordered = sorted(values)
              index = max(0, min(len(ordered) - 1, int((p * len(ordered) + 0.999999)) - 1))
              return ordered[index]

          failure_pareto = [
              {"workflow": workflow, "conclusion": conclusion, "count": count}
              for (workflow, conclusion), count in sorted(
                  failure_counts.items(), key=lambda item: (-item[1], item[0][0], item[0][1])
              )
          ]
          cancellation_pareto = [
              {"workflow": workflow, "count": count}
              for workflow, count in sorted(
                  cancellation_counts.items(), key=lambda item: (-item[1], item[0])
              )
          ]
          skipped_pareto = [
              {"workflow": workflow, "count": count}
              for workflow, count in sorted(
                  skipped_counts.items(), key=lambda item: (-item[1], item[0])
              )
          ]
          failed_count = sum(failure_counts.values())
          cancelled_count = sum(cancellation_counts.values())
          skipped_count = sum(skipped_counts.values())

          metrics = {
              "schemaVersion": "1.8.0",
              "sampleCount": len(queue_seconds),
              "meanQueueTimeSeconds": statistics.fmean(queue_seconds),
              "queueTimeP50Seconds": nearest_rank(queue_seconds, 0.50),
              "queueTimeP95Seconds": nearest_rank(queue_seconds, 0.95),
              "leadTimeSampleCount": len(lead_seconds),
              "meanLeadTimeSeconds": statistics.fmean(lead_seconds),
              "leadTimeP50Seconds": nearest_rank(lead_seconds, 0.50),
              "leadTimeP95Seconds": nearest_rank(lead_seconds, 0.95),
              "repairTimeSampleCount": len(repair_seconds),
              "meanRepairTimeSeconds": statistics.fmean(repair_seconds) if repair_seconds else None,
              "repairTimeP50Seconds": nearest_rank(repair_seconds, 0.50) if repair_seconds else None,
              "repairTimeP95Seconds": nearest_rank(repair_seconds, 0.95) if repair_seconds else None,
              "repairTimeState": "VERIFIED" if repair_seconds else "UNVERIFIED",
              "deployProbeTimeSampleCount": len(deploy_probe_seconds),
              "meanDeployProbeTimeSeconds": statistics.fmean(deploy_probe_seconds) if deploy_probe_seconds else None,
              "deployProbeTimeP50Seconds": nearest_rank(deploy_probe_seconds, 0.50) if deploy_probe_seconds else None,
              "deployProbeTimeP95Seconds": nearest_rank(deploy_probe_seconds, 0.95) if deploy_probe_seconds else None,
              "deployProbeTimeState": "VERIFIED" if deploy_probe_seconds else "UNVERIFIED",
              "completedWorkflowSampleCount": completed_count,
              "firstPassEligibleSampleCount": first_pass_eligible_count,
              "firstPassSuccessSampleCount": first_pass_success_count,
              "failedWorkflowSampleCount": failed_count,
              "cancelledWorkflowSampleCount": cancelled_count,
              "skippedWorkflowSampleCount": skipped_count,
              "firstPassYield": first_pass_success_count / first_pass_eligible_count if first_pass_eligible_count else None,
              "selfHealAttemptSampleCount": self_heal_attempt_count,
              "selfHealSuccessSampleCount": self_heal_success_count,
              "selfHealUnknownSampleCount": self_heal_unknown_count,
              "humanRerunSampleCount": human_rerun_count,
              "selfHealRate": self_heal_success_count / self_heal_attempt_count if self_heal_attempt_count else None,
              "selfHealRateState": "UNVERIFIED" if self_heal_unknown_count else ("VERIFIED" if self_heal_attempt_count else "UNVERIFIED"),
              "failurePareto": failure_pareto,
              "cancellationPareto": cancellation_pareto,
              "skippedPareto": skipped_pareto,
              "failureParetoState": "VERIFIED" if first_pass_eligible_count else "UNVERIFIED",
              "cancellationParetoState": "VERIFIED" if completed_count else "UNVERIFIED",
              "skippedParetoState": "VERIFIED" if completed_count else "UNVERIFIED",
              "source": "github-actions-runs",
              "branch": "main",
              "sourceRevision": os.environ["SOURCE_REVISION"],
          }
          with open("factory-runtime-metrics.json", "w", encoding="utf-8") as output:
              json.dump(metrics, output, indent=2, sort_keys=True)
              output.write("\n")
          print(json.dumps(metrics, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Factory runtime metrics\n\n```json\n")
              summary.write(json.dumps(metrics, indent=2, sort_keys=True))
              summary.write("\n```\n")
          PY

      - name: Upload runtime metrics evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-runtime-metrics-${{ github.run_id }}
          path: factory-runtime-metrics.json
          if-no-files-found: error
          retention-days: 14
