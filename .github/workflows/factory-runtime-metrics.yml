name: Factory Runtime Metrics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/factory-runtime-metrics.yml"
      - ".github/workflows/factory-*.yml"
      - "dashboard/factory_*.py"
      - "dashboard/collectors/factory_evidence.py"
  pull_request:
    paths:
      - ".github/workflows/factory-runtime-metrics.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: factory-runtime-metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Collect queue, lead, and repair timing from GitHub Actions
        id: metrics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import statistics
          import urllib.request
          from datetime import datetime

          repo = os.environ["GH_REPOSITORY"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs?branch=main&per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              payload = json.load(response)

          runs = payload.get("workflow_runs")
          if not isinstance(runs, list):
              raise SystemExit("workflow_runs evidence is missing")

          def parse(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          queue_seconds = []
          lead_seconds = []
          repair_seconds = []
          for run in runs:
              created = run.get("created_at")
              started = run.get("run_started_at")
              updated = run.get("updated_at")
              if created and started:
                  queue_seconds.append(max(0.0, (parse(started) - parse(created)).total_seconds()))
              if created and updated and run.get("status") == "completed":
                  duration = max(0.0, (parse(updated) - parse(created)).total_seconds())
                  lead_seconds.append(duration)
                  if run.get("name") == "Factory Repair Agent":
                      repair_seconds.append(duration)

          if not queue_seconds:
              raise SystemExit("no observed queue timing evidence")
          if not lead_seconds:
              raise SystemExit("no observed completed workflow lead timing evidence")

          def nearest_rank(values, p):
              ordered = sorted(values)
              index = max(0, min(len(ordered) - 1, int((p * len(ordered) + 0.999999)) - 1))
              return ordered[index]

          metrics = {
              "schemaVersion": "1.2.0",
              "sampleCount": len(queue_seconds),
              "meanQueueTimeSeconds": statistics.fmean(queue_seconds),
              "queueTimeP50Seconds": nearest_rank(queue_seconds, 0.50),
              "queueTimeP95Seconds": nearest_rank(queue_seconds, 0.95),
              "leadTimeSampleCount": len(lead_seconds),
              "meanLeadTimeSeconds": statistics.fmean(lead_seconds),
              "leadTimeP50Seconds": nearest_rank(lead_seconds, 0.50),
              "leadTimeP95Seconds": nearest_rank(lead_seconds, 0.95),
              "repairTimeSampleCount": len(repair_seconds),
              "meanRepairTimeSeconds": statistics.fmean(repair_seconds) if repair_seconds else None,
              "repairTimeP50Seconds": nearest_rank(repair_seconds, 0.50) if repair_seconds else None,
              "repairTimeP95Seconds": nearest_rank(repair_seconds, 0.95) if repair_seconds else None,
              "repairTimeState": "VERIFIED" if repair_seconds else "UNVERIFIED",
              "source": "github-actions-runs",
              "branch": "main",
              "sourceRevision": os.environ.get("GITHUB_SHA"),
          }
          with open("factory-runtime-metrics.json", "w", encoding="utf-8") as output:
              json.dump(metrics, output, indent=2, sort_keys=True)
              output.write("\n")
          print(json.dumps(metrics, sort_keys=True))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Factory runtime metrics\n\n```json\n")
              summary.write(json.dumps(metrics, indent=2, sort_keys=True))
              summary.write("\n```\n")
          PY

      - name: Upload runtime metrics evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: factory-runtime-metrics-${{ github.run_id }}
          path: factory-runtime-metrics.json
          if-no-files-found: error
          retention-days: 14
