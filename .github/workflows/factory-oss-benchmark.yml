name: Factory OSS Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'

permissions:
  contents: write

concurrency:
  group: factory-oss-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Collect GitHub Trending daily/monthly authority
        run: python -m dashboard.oss_benchmark --windows daily monthly
      - name: Verify collector contracts
        run: python -m pytest -q tests/test_oss_benchmark.py
      - name: Persist benchmark ledger when changed
        run: |
          if git diff --quiet -- dashboard/oss-benchmark-ledger.json; then
            echo 'No benchmark ledger change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/oss-benchmark-ledger.json
          git commit -m 'chore(factory): refresh OSS benchmark ledger'
          git push
