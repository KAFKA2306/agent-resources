name: Factory OSS Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'

permissions:
  contents: write

concurrency:
  group: factory-oss-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install benchmark test dependencies
        run: python -m pip install 'pytest>=8.0'
      - name: Collect GitHub Trending daily/monthly authority
        id: collect
        continue-on-error: true
        run: python -m dashboard.oss_benchmark --windows daily monthly
      - name: Analyze exact OSS revisions and local capability gaps
        id: analyze
        continue-on-error: true
        run: python -m dashboard.benchmark_analysis --limit 5
      - name: Verify benchmark contracts
        run: |
          python -m pytest -q \
            tests/test_oss_benchmark.py \
            tests/test_benchmark_selection.py \
            tests/test_benchmark_analysis.py
      - name: Persist benchmark state when changed
        run: |
          if git diff --quiet -- dashboard/oss-benchmark-ledger.json dashboard/oss-benchmark-candidates.json; then
            echo 'No benchmark state change.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/oss-benchmark-ledger.json dashboard/oss-benchmark-candidates.json
          git commit -m 'chore(factory): refresh OSS benchmark analysis'
          git push
      - name: Record fail-soft external benchmark state
        if: steps.collect.outcome != 'success' || steps.analyze.outcome != 'success'
        run: |
          echo '::warning::OSS benchmark evidence is UNVERIFIED/PARTIAL; factory repair/production work must continue.'
          echo 'OSS_BENCHMARK_STATUS=UNVERIFIED' >> "$GITHUB_ENV"
