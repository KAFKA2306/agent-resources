name: Set repository agent zone

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'KAFKA2306/<repository>'
        required: true
        type: string
      zone:
        description: 'agent-zone-<semantic-domain>'
        required: true
        type: string

permissions:
  contents: read

jobs:
  set-zone:
    runs-on: ubuntu-latest
    env:
      GH_ADMIN_TOKEN: ${{ secrets.DASHBOARD_GITHUB_TOKEN }}
      TARGET_REPOSITORY: ${{ inputs.repository }}
      TARGET_ZONE: ${{ inputs.zone }}
    steps:
      - name: Validate explicit assignment and replace only agent-zone topic
        shell: python
        run: |
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          repo = os.environ['TARGET_REPOSITORY'].strip()
          zone = os.environ['TARGET_ZONE'].strip().lower()
          token = os.environ.get('GH_ADMIN_TOKEN', '').strip()

          if not repo.startswith('KAFKA2306/') or repo.count('/') != 1:
              raise SystemExit('repository must be KAFKA2306/<name>')
          if not re.fullmatch(r'agent-zone-[a-z0-9]+(?:-[a-z0-9]+)*', zone):
              raise SystemExit('zone must match agent-zone-<semantic-domain>')
          if not token:
              raise SystemExit('DASHBOARD_GITHUB_TOKEN is not configured')

          url = f'https://api.github.com/repos/{repo}/topics'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2026-03-10',
              'User-Agent': 'agent-resources-zone-setter',
          }

          with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as response:
              current = json.load(response).get('names', [])

          names = sorted({topic for topic in current if not topic.startswith('agent-zone-')} | {zone})
          payload = json.dumps({'names': names}).encode('utf-8')
          request = urllib.request.Request(
              url,
              data=payload,
              headers={**headers, 'Content-Type': 'application/json'},
              method='PUT',
          )
          try:
              with urllib.request.urlopen(request) as response:
                  updated = json.load(response).get('names', [])
          except urllib.error.HTTPError as exc:
              if exc.code == 403:
                  raise SystemExit('topic update forbidden: token requires repository Administration(write)') from exc
              raise

          if zone not in updated:
              raise SystemExit(f'zone topic was not persisted: {updated}')
          print(f'{repo}: {zone}')
