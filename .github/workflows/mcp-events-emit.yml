name: Emit MCP Events

on:
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, closed, reopened, synchronize]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: ["Validate Dashboard PR"]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  emit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Forward event with short-lived GitHub OIDC
        env:
          MCP_EVENTS_INGRESS: https://agent-resources-one.vercel.app/api/github-events
          MCP_EVENTS_AUDIENCE: agent-resources-mcp-events
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${MCP_EVENTS_AUDIENCE}")"
          oidc_token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"${oidc_response}")"

          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request POST \
            -H "Authorization: Bearer ${oidc_token}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: ${GITHUB_EVENT_NAME}" \
            --data-binary "@${GITHUB_EVENT_PATH}" \
            "${MCP_EVENTS_INGRESS}")"

          cat "${response_file}"
          echo
          case "${status}" in
            202|207)
              exit 0
              ;;
            503)
              echo "MCP Events storage is not configured yet; event emission is safely dormant."
              exit 0
              ;;
            *)
              echo "MCP Events ingress returned HTTP ${status}" >&2
              exit 1
              ;;
          esac
