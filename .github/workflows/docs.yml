name: Build and Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'dashboard/**'
      - 'package.json'
      - '.github/workflows/docs.yml'
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.DASHBOARD_GITHUB_TOKEN || github.token }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DASHBOARD_PUBLIC_SNAPSHOT_URL: https://kafka2306.github.io/agent-resources/dashboard/dashboard.json
      REPOSITORY_OPERATIONS_PUBLIC_SNAPSHOT_URL: https://kafka2306.github.io/agent-resources/dashboard/repository-operations.json
    steps:
      - uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        if: github.event_name != 'schedule'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: pip install mkdocs-material -r dashboard/requirements.txt

      - name: Run dashboard QA
        if: github.event_name != 'schedule'
        run: |
          set -euo pipefail
          python -m unittest discover -s dashboard/tests -p 'test_*.py' -v
          npm run test:dashboard

      - name: Collect public GitHub dashboard data
        run: |
          set -euo pipefail
          mkdir -p dashboard/generated docs/dashboard
          python -m dashboard.collectors.repositories --output dashboard/generated/repositories.json

          reuse_previous=1
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            reuse_previous=0
          elif [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "$(TZ=Asia/Tokyo date +%H)" = "09" ]; then
            reuse_previous=0
          fi

          if [ "$reuse_previous" -eq 1 ]; then
            python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          target = Path('dashboard/generated/previous-dashboard.json')
          request = urllib.request.Request(
              os.environ['DASHBOARD_PUBLIC_SNAPSHOT_URL'],
              headers={'Cache-Control': 'no-cache', 'User-Agent': 'agent-resources-stats-baseline'},
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  payload = json.loads(response.read().decode('utf-8'))
              if not isinstance(payload, dict) or payload.get('stats', {}).get('scope') != 'public':
                  raise ValueError('previous dashboard is not a public stats snapshot')
              target.write_text(json.dumps(payload, ensure_ascii=False), encoding='utf-8')
              print('closed-month stats baseline: previous production snapshot')
          except Exception as exc:
              print(f'closed-month stats baseline unavailable; full refresh: {exc}')
          PY
          else
            echo "closed-month stats baseline bypassed; scheduled/manual full refresh"
          fi

          stats_args=(
            --start-month 2026-01
            --request-interval 2.2
            --repositories dashboard/generated/repositories.json
            --output dashboard/generated/github-stats.json
          )
          if [ -s dashboard/generated/previous-dashboard.json ]; then
            stats_args+=(--previous-dashboard dashboard/generated/previous-dashboard.json)
          fi
          python -m dashboard.collectors.github_stats "${stats_args[@]}"
          python -m dashboard.collectors.work_items --repositories dashboard/generated/repositories.json --output dashboard/generated/work-items.json
          python -m dashboard.collectors.workflow_runs --repositories dashboard/generated/repositories.json --output dashboard/generated/workflow-runs.json
          python -m dashboard.collectors.recent_activity --repositories dashboard/generated/repositories.json --window-days 7 --output dashboard/generated/recent-activity.json

          if [ "$reuse_previous" -eq 1 ]; then
            python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          from jsonschema import Draft202012Validator

          target = Path('docs/dashboard/repository-operations.json')
          request = urllib.request.Request(
              os.environ['REPOSITORY_OPERATIONS_PUBLIC_SNAPSHOT_URL'],
              headers={'Cache-Control': 'no-cache', 'User-Agent': 'agent-resources-operations-baseline'},
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  payload = json.loads(response.read().decode('utf-8'))
              schema = json.loads(Path('dashboard/schema/repository-operations.schema.json').read_text(encoding='utf-8'))
              Draft202012Validator(schema).validate(payload)
              required = ('generatedAt', 'sourceRevision', 'runId', 'repositories')
              if not isinstance(payload, dict) or any(not payload.get(key) for key in required):
                  raise ValueError('previous repository operations snapshot is incomplete')
              if not isinstance(payload['repositories'], list) or not payload['repositories']:
                  raise ValueError('previous repository operations snapshot has zero repositories')
              target.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
              print('repository operations baseline: previous production snapshot')
          except Exception as exc:
              print(f'repository operations baseline unavailable; full refresh: {exc}')
          PY
          fi

          if [ ! -s docs/dashboard/repository-operations.json ]; then
            python -m dashboard.collectors.repository_operations \
              --output docs/dashboard/repository-operations.json \
              --run-id "${GITHUB_RUN_ID}"
          fi

      - name: Build and validate canonical dashboard snapshot
        run: |
          set -euo pipefail
          python -m dashboard.build \
            --repositories dashboard/generated/repositories.json \
            --work-items dashboard/generated/work-items.json \
            --workflow-runs dashboard/generated/workflow-runs.json \
            --activity dashboard/generated/recent-activity.json \
            --stats dashboard/generated/github-stats.json \
            --schema dashboard/schema/dashboard.schema.json \
            --output docs/dashboard/dashboard.json

      - name: Build docs
        working-directory: docs
        run: mkdocs build

      - name: Prepare deploy directory
        run: |
          set -euo pipefail
          mkdir -p deploy/site
          cp docs/index.html deploy/
          cp -r docs/dashboard deploy/dashboard
          cp -r docs/site/* deploy/site/

      - name: Validate deploy bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator
          from dashboard.build import validate_snapshot

          root = Path('deploy/dashboard')
          html = (root / 'index.html').read_text(encoding='utf-8')
          dashboard_js = (root / 'dashboard.js').read_text(encoding='utf-8')
          stats_js = (root / 'stats.js').read_text(encoding='utf-8')
          snapshot = json.loads((root / 'dashboard.json').read_text(encoding='utf-8'))
          schema = json.loads(Path('dashboard/schema/dashboard.schema.json').read_text(encoding='utf-8'))
          validate_snapshot(snapshot, schema)

          operations = json.loads((root / 'repository-operations.json').read_text(encoding='utf-8'))
          operations_schema = json.loads(Path('dashboard/schema/repository-operations.schema.json').read_text(encoding='utf-8'))
          Draft202012Validator(operations_schema).validate(operations)
          if not operations.get("generatedAt") or not operations.get("sourceRevision") or not operations.get("runId"):
              raise SystemExit('repository operations snapshot is missing provenance')
          if not operations.get('repositories'):
              raise SystemExit('repository operations snapshot has zero repositories')

          if 'PUBLIC PRESENCE' in html or 'project-groups' in html:
              raise SystemExit('retired dashboard view leaked into deploy bundle')
          if 'groupsRoot' in dashboard_js or 'public-links' in stats_js:
              raise SystemExit('retired dashboard JavaScript leaked into deploy bundle')
          for retired in ('public-links.js', 'public-links.css', 'public-links.json'):
              if (root / retired).exists():
                  raise SystemExit(f'retired dashboard asset leaked into deploy bundle: {retired}')
          if not snapshot.get('repositories'):
              raise SystemExit('deploy snapshot has zero repositories')
          if not snapshot.get('activity'):
              raise SystemExit('deploy snapshot has zero recent activity')
          print(f"deploy repositories: {len(snapshot['repositories'])}")
          print(f"deploy activity: {len(snapshot['activity'])}")
          print(f"deploy repository operations: {len(operations['repositories'])}")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v6

      - name: Verify deployed dashboard
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ['PAGE_URL'].rstrip('/')
          nonce = os.environ['EXPECTED_SHA']

          def fetch(path):
              url = f"{base}/dashboard/{path}?v={nonce}"
              request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache', 'User-Agent': 'agent-resources-pages-smoke'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  return response.read().decode('utf-8')

          for attempt in range(6):
              try:
                  html = fetch('')
                  dashboard_js = fetch('dashboard.js')
                  stats_js = fetch('stats.js')
                  snapshot = json.loads(fetch('dashboard.json'))
                  operations = json.loads(fetch('repository-operations.json'))
                  if 'PUBLIC PRESENCE' in html or 'project-groups' in html:
                      raise RuntimeError('retired view is still deployed')
                  if 'groupsRoot' in dashboard_js or 'public-links' in stats_js:
                      raise RuntimeError('retired JavaScript is still deployed')
                  if not snapshot.get('repositories'):
                      raise RuntimeError('deployed dashboard has zero repositories')
                  if snapshot.get('stats', {}).get('publicRepositories') != len(snapshot['repositories']):
                      raise RuntimeError('deployed stats repository count diverged from canonical list')
                  if not snapshot.get('activity'):
                      raise RuntimeError('deployed dashboard has zero recent activity')
                  if not snapshot.get('stats', {}).get('monthly'):
                      raise RuntimeError('deployed dashboard has no monthly stats')
                  if not operations.get("generatedAt") or not operations.get("sourceRevision") or not operations.get("runId"):
                      raise RuntimeError('deployed repository operations snapshot is missing provenance')
                  if not operations.get('repositories'):
                      raise RuntimeError('deployed repository operations snapshot has zero repositories')
                  try:
                      fetch('public-links.js')
                  except urllib.error.HTTPError as exc:
                      if exc.code != 404:
                          raise
                  else:
                      raise RuntimeError('retired public-links.js is still deployed')
                  print(f"deployed repositories: {len(snapshot['repositories'])}")
                  print(f"deployed activity: {len(snapshot['activity'])}")
                  print(f"deployed monthly buckets: {len(snapshot['stats']['monthly'])}")
                  print(f"deployed repository operations: {len(operations['repositories'])}")
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(5)
          PY
          python -m dashboard.production_live_smoke

      - name: Verify rendered dashboard in headless Chrome
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$chrome"
          target="${PAGE_URL%/}/dashboard/"
          for attempt in 1 2 3 4 5 6; do
            if "$chrome" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=10000 \
              --dump-dom "$target" > rendered-dashboard.html 2> chrome-smoke.log; then
              if python - <<'PY'
          import re
          from pathlib import Path

          html = Path('rendered-dashboard.html').read_text(encoding='utf-8')
          forbidden = (
              'PUBLIC PRESENCE',
              'Repository details',
              '直近7日の活動は0件です。',
              '公開GitHub統計はまだ取得されていません。',
          )
          for text in forbidden:
              if text in html:
                  raise SystemExit(f'rendered dashboard contains forbidden stale/empty state: {text}')

          repo_match = re.search(r'id="repository-count"[^>]*>\s*(\d+) repositories\s*<', html)
          if not repo_match or int(repo_match.group(1)) <= 0:
              raise SystemExit('rendered dashboard has zero repositories')

          work_item_match = re.search(r'id="agent-world-summary"[^>]*>\s*作業項目\s+(\d+)件', html)
          if not work_item_match or int(work_item_match.group(1)) <= 0:
              raise SystemExit('rendered dashboard has zero work items')

          status_match = re.search(r'id="snapshot-status"[^>]*>([^<]+)<', html)
          status = status_match.group(1).strip() if status_match else ''
          if status != 'LIVE':
              raise SystemExit(f'rendered dashboard live status is not LIVE: {status or "missing"}')

          if 'class="activity-item"' not in html:
              raise SystemExit('rendered dashboard has no recent activity items')
          if 'Public repositories' not in html:
              raise SystemExit('rendered dashboard monthly statistics did not render')

          print(f"browser repositories: {repo_match.group(1)}")
          print(f"browser work items: {work_item_match.group(1)}")
          print(f"browser snapshot status: {status}")
          PY
              then
                exit 0
              fi
            fi
            if [ "$attempt" -eq 6 ]; then
              cat chrome-smoke.log >&2 || true
              exit 1
            fi
            sleep 5
          done
