name: Build and Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'dashboard/**'
      - '.github/workflows/docs.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.DASHBOARD_GITHUB_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install mkdocs-material -r dashboard/requirements.txt

      - name: Collect public GitHub dashboard data
        run: |
          set -euo pipefail
          mkdir -p dashboard/generated docs/dashboard
          python -m dashboard.collectors.repositories --output dashboard/generated/repositories.json
          python -m dashboard.collectors.work_items --repositories dashboard/generated/repositories.json --output dashboard/generated/work-items.json
          python -m dashboard.collectors.workflow_runs --repositories dashboard/generated/repositories.json --output dashboard/generated/workflow-runs.json
          python -m dashboard.collectors.github_stats --start-month 2026-01 --output dashboard/generated/github-stats.json

      - name: Build and validate canonical dashboard snapshot
        run: |
          set -euo pipefail
          python -m dashboard.build \
            --repositories dashboard/generated/repositories.json \
            --work-items dashboard/generated/work-items.json \
            --workflow-runs dashboard/generated/workflow-runs.json \
            --stats dashboard/generated/github-stats.json \
            --schema dashboard/schema/dashboard.schema.json \
            --output docs/dashboard/dashboard.json

      - name: Audit public artifact boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot = json.loads(Path('docs/dashboard/dashboard.json').read_text(encoding='utf-8'))
          if snapshot.get('stats', {}).get('scope') != 'public':
              raise SystemExit('stats scope is not public')
          if any(repo.get('visibility') != 'public' for repo in snapshot.get('repositories', [])):
              raise SystemExit('non-public repository leaked into dashboard snapshot')
          monthly = snapshot.get('stats', {}).get('monthly', [])
          if not monthly:
              raise SystemExit('monthly GitHub stats are missing')
          print(f"public repositories: {snapshot['stats']['publicRepositories']}")
          print(f"monthly buckets: {len(monthly)}")
          PY

      - name: Build docs
        working-directory: docs
        run: mkdocs build

      - name: Prepare deploy directory
        run: |
          set -euo pipefail
          mkdir -p deploy/site
          cp docs/index.html deploy/
          cp -r docs/dashboard deploy/dashboard
          cp -r docs/site/* deploy/site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
