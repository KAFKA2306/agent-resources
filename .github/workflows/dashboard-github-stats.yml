name: Dashboard GitHub stats

on:
  push:
    branches:
      - main
    paths:
      - "dashboard/collectors/github_api.py"
      - "dashboard/collectors/github_stats.py"
      - "dashboard/collectors/actions_budget.py"
      - "dashboard/build.py"
      - "dashboard/schema/dashboard.schema.json"
      - "dashboard/tests/test_github_stats_collector.py"
      - "dashboard/tests/test_actions_budget_collector.py"
      - "dashboard/tests/test_build.py"
      - ".github/workflows/dashboard-github-stats.yml"
  pull_request:
    paths:
      - "dashboard/collectors/github_api.py"
      - "dashboard/collectors/github_stats.py"
      - "dashboard/collectors/actions_budget.py"
      - "dashboard/build.py"
      - "dashboard/schema/dashboard.schema.json"
      - "dashboard/tests/test_github_stats_collector.py"
      - "dashboard/tests/test_actions_budget_collector.py"
      - "dashboard/tests/test_build.py"
      - ".github/workflows/dashboard-github-stats.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install -r dashboard/requirements.txt
      - name: Compile collectors and builder
        run: >-
          python -m py_compile
          dashboard/collectors/github_api.py
          dashboard/collectors/github_stats.py
          dashboard/collectors/actions_budget.py
          dashboard/build.py
      - name: Run collector and snapshot tests
        run: >-
          python -m unittest
          dashboard.tests.test_github_stats_collector
          dashboard.tests.test_actions_budget_collector
          dashboard.tests.test_build
          -v
