name: Verify Dashboard Release
run-name: >-
  Dashboard release ·
  ${{ github.event.client_payload.environment || 'manual' }} ·
  ${{ github.event.client_payload.git.sha || github.sha }}

on:
  repository_dispatch:
    types:
      - vercel.deployment.success
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Vercel deployment or production URL to verify'
        required: false
        default: 'https://agent-resources-one.vercel.app'
        type: string

permissions:
  contents: read

concurrency:
  group: dashboard-release-verification-${{ github.event.client_payload.environment || 'manual' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_URL: ${{ github.event.client_payload.url || inputs.deployment_url || 'https://agent-resources-one.vercel.app' }}
      DEPLOYMENT_ENVIRONMENT: ${{ github.event.client_payload.environment || 'production' }}
      EXPECTED_SHA: ${{ github.event.client_payload.git.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.client_payload.git.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Classify Vercel deployment
        id: deployment
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "is_production=true" >> "$GITHUB_OUTPUT"
            echo "target_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$DEPLOYMENT_ENVIRONMENT" = "production" ]; then
            echo "is_production=true" >> "$GITHUB_OUTPUT"
            echo "target_url=https://agent-resources-one.vercel.app" >> "$GITHUB_OUTPUT"
          else
            echo "is_production=false" >> "$GITHUB_OUTPUT"
            echo "target_url=" >> "$GITHUB_OUTPUT"
          fi

          echo "environment=$DEPLOYMENT_ENVIRONMENT deployment_url=$RELEASE_URL"

      - name: Skip non-production deployment
        if: steps.deployment.outputs.is_production != 'true'
        run: echo 'Preview deployment succeeded; product release verification is not applicable.'

      - name: Verify production live payload
        if: steps.deployment.outputs.is_production == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.target_url }}
        run: python dashboard/production_live_smoke.py

      - name: Verify released production dashboard
        if: steps.deployment.outputs.is_production == 'true'
        env:
          AGENT_RESOURCES_DASHBOARD_URL: ${{ steps.deployment.outputs.target_url }}/dashboard/
          PYTHONPATH: ${{ github.workspace }}
        run: python dashboard/tests/dashboard_repository_operations_production_e2e.py

      - name: Record exact-revision release provenance
        if: steps.deployment.outputs.is_production == 'true'
        run: |
          python dashboard/release_provenance.py \
            --revision "$EXPECTED_SHA" \
            --deployment-url "${{ steps.deployment.outputs.target_url }}" \
            --environment "$DEPLOYMENT_ENVIRONMENT" \
            --run-id "$GITHUB_RUN_ID" \
            --output release-evidence/provenance.json

      - name: Preserve release provenance
        if: steps.deployment.outputs.is_production == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-provenance-${{ env.EXPECTED_SHA }}
          path: release-evidence/provenance.json
          if-no-files-found: error
          retention-days: 30
