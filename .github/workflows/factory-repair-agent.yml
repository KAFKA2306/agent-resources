name: Factory Repair Agent

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Failed workflow run to repair
        required: true
        type: string
      failure_fingerprint:
        description: Stable failure fingerprint
        required: true
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: factory-repair-${{ inputs.failure_fingerprint }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read failed-run evidence and claim current PR head
        id: evidence
        uses: actions/github-script@v8
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const run_id = Number(process.env.SOURCE_RUN_ID);
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id });
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({ owner: context.repo.owner, repo: context.repo.repo, run_id, per_page: 100 });
            if (run.conclusion !== 'failure') { core.setFailed(`source run ${run_id} is not a failed run`); return; }
            const failed = jobs.jobs.flatMap(job => (job.steps || [])).filter(step => step.conclusion === 'failure').map(step => step.name);
            if (!failed.length) { core.setFailed('no failed step evidence; refusing speculative repair'); return; }
            if (!run.pull_requests || run.pull_requests.length !== 1) { core.setFailed('expected exactly one source PR for repair'); return; }
            const sourcePr = run.pull_requests[0];
            if (!sourcePr.head?.sha || !sourcePr.head?.ref) { core.setFailed('source PR head evidence is incomplete'); return; }
            const { data: currentPr } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: sourcePr.number });
            if (currentPr.state !== 'open' || currentPr.head.sha !== sourcePr.head.sha) {
              core.notice(`NO_WORK: PR #${sourcePr.number} already moved from failed head ${sourcePr.head.sha} to ${currentPr.head.sha}; a prior repair or human update owns the current head`);
              core.setOutput('claimed', 'false');
              await core.summary.addHeading('Factory Repair Agent').addRaw(`NO_WORK: PR #${sourcePr.number} no longer points at failed head ${sourcePr.head.sha}.`).write();
              return;
            }
            core.setOutput('claimed', 'true');
            core.setOutput('failed_steps', JSON.stringify(failed));
            core.setOutput('head_sha', sourcePr.head.sha);
            core.setOutput('head_branch', sourcePr.head.ref);

      - uses: actions/checkout@v6
        if: steps.evidence.outputs.claimed == 'true'
        with:
          ref: ${{ steps.evidence.outputs.head_sha }}
          fetch-depth: 0

      - name: Apply deterministic repair
        if: steps.evidence.outputs.claimed == 'true'
        env:
          FAILED_STEPS: ${{ steps.evidence.outputs.failed_steps }}
        shell: bash
        run: |
          set -euo pipefail
          case "$FAILED_STEPS" in
            *"Validate README resource links"*)
              python - <<'PY'
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          required = ['https://agent-resources-one.vercel.app/', 'https://github.com/KAFKA2306/design', '(skills/kafka-evidence-ui/SKILL.md)', '(plugins/kafka-evidence-ui/README.md)']
          missing = [item for item in required if item not in text]
          if missing:
              text = text.rstrip() + '\n\n## Required resource links\n\n' + '\n'.join(f'- {item}' for item in missing) + '\n'
              readme.write_text(text, encoding='utf-8')
          PY
              ;;
            *"Run commit-time validation"*)
              python -m pip install pre-commit==4.6.2 mkdocs-material -r dashboard/requirements.txt
              pre-commit run --all-files --hook-stage pre-commit || true
              ;;
            *) echo "No deterministic repair rule for: $FAILED_STEPS" >&2; exit 78 ;;
          esac
          if git diff --quiet; then echo "repair rule produced no diff" >&2; exit 79; fi

      - name: Verify deterministic repair
        if: steps.evidence.outputs.claimed == 'true'
        env:
          FAILED_STEPS: ${{ steps.evidence.outputs.failed_steps }}
        shell: bash
        run: |
          set -euo pipefail
          case "$FAILED_STEPS" in
            *"Validate README resource links"*)
              python - <<'PY'
          from pathlib import Path
          readme = Path('README.md').read_text(encoding='utf-8')
          required = ['https://agent-resources-one.vercel.app/', 'https://github.com/KAFKA2306/design', '(skills/kafka-evidence-ui/SKILL.md)', '(plugins/kafka-evidence-ui/README.md)']
          missing = [item for item in required if item not in readme]
          if missing: raise SystemExit(f'missing README links after repair: {missing}')
          for path in ('skills/kafka-evidence-ui/SKILL.md', 'plugins/kafka-evidence-ui/README.md'):
              if not Path(path).is_file(): raise SystemExit(f'missing linked file: {path}')
          PY
              ;;
            *"Run commit-time validation"*)
              pre-commit run --all-files --hook-stage pre-commit
              ;;
            *) echo "No deterministic verifier for: $FAILED_STEPS" >&2; exit 78 ;;
          esac

      - name: Publish repair back to source PR
        if: steps.evidence.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURE_FINGERPRINT: ${{ inputs.failure_fingerprint }}
          HEAD_BRANCH: ${{ steps.evidence.outputs.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "factory-repair[bot]"
          git config user.email "factory-repair@users.noreply.github.com"
          git add -A
          git commit -m "factory: deterministic repair ${FAILURE_FINGERPRINT:0:12}"
          git push origin "HEAD:$HEAD_BRANCH"
          repair_sha="$(git rev-parse HEAD)"
          gh workflow run dashboard-validate.yml --ref "$HEAD_BRANCH" -f head_sha="$repair_sha"
