name: Factory Repair Agent

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Failed workflow run to repair
        required: true
        type: string
      failure_fingerprint:
        description: Stable failure fingerprint
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: factory-repair-${{ inputs.failure_fingerprint }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Read failed-run evidence
        id: evidence
        uses: actions/github-script@v8
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const run_id = Number(process.env.SOURCE_RUN_ID);
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id,
            });
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id, per_page: 100,
            });
            if (run.conclusion !== 'failure') {
              core.setFailed(`source run ${run_id} is not a failed run`);
              return;
            }
            const failed = jobs.jobs.flatMap(job => (job.steps || []))
              .filter(step => step.conclusion === 'failure')
              .map(step => step.name);
            if (!failed.length) {
              core.setFailed('no failed step evidence; refusing speculative repair');
              return;
            }
            core.setOutput('head_sha', run.head_sha);
            core.setOutput('failed_steps', JSON.stringify(failed));

      - name: Apply deterministic generated-file repair
        id: repair
        env:
          FAILED_STEPS: ${{ steps.evidence.outputs.failed_steps }}
        shell: bash
        run: |
          set -euo pipefail
          case "$FAILED_STEPS" in
            *"Validate README resource links"*)
              python scripts/generate_resource_index.py
              ;;
            *)
              echo "No deterministic repair rule for: $FAILED_STEPS" >&2
              exit 78
              ;;
          esac
          if git diff --quiet; then
            echo "repair rule produced no diff" >&2
            exit 79
          fi

      - name: Verify deterministic repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_readme_resource_links.py

      - name: Publish isolated repair PR
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          FAILURE_FINGERPRINT: ${{ inputs.failure_fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          branch="factory/repair-${FAILURE_FINGERPRINT:0:12}"
          git config user.name "factory-repair[bot]"
          git config user.email "factory-repair@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "factory: deterministic repair ${FAILURE_FINGERPRINT:0:12}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "factory: repair ${FAILURE_FINGERPRINT:0:12}" \
            --body "Deterministic repair for failed workflow run ${SOURCE_RUN_ID}. Failure fingerprint: ${FAILURE_FINGERPRINT}. Returns through normal validation and autonomous merge gates."
