name: Validate OpenClaw autonomous worker

on:
  pull_request:
    paths:
      - 'scripts/openclaw-autonomous-worker/**'
      - 'tests/test_openclaw_autonomous_worker.py'
      - '.github/workflows/openclaw-autonomous-worker.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/openclaw-autonomous-worker/**'
      - 'tests/test_openclaw_autonomous_worker.py'
      - '.github/workflows/openclaw-autonomous-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Compile supervisor
        run: python -m py_compile scripts/openclaw-autonomous-worker/supervisor.py

      - name: Run supervisor unit tests
        run: python -m pytest -q tests/test_openclaw_autonomous_worker.py

      - name: Validate shell syntax
        run: |
          bash -n scripts/openclaw-autonomous-worker/install-systemd.sh
          bash -n scripts/openclaw-autonomous-worker/prepare-freetoken.sh
          bash -n scripts/openclaw-autonomous-worker/run-freetoken.sh
          bash -n scripts/openclaw-autonomous-worker/run-openclaw-gateway.sh
          bash -n scripts/openclaw-autonomous-worker/verify-freetoken.sh

      - name: Validate systemd units
        run: |
          systemd-analyze verify \
            scripts/openclaw-autonomous-worker/systemd/freetoken.service \
            scripts/openclaw-autonomous-worker/systemd/openclaw-gateway.service \
            scripts/openclaw-autonomous-worker/systemd/openclaw-autonomous-worker.service
