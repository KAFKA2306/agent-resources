site_name: Software Factory Control Tower
site_url: https://agent-resources-one.vercel.app/site/
site_description: 自律ソフトウェア工場のControl Towerと、AI agent skillsを導入・共有・実行するAGR CLIのドキュメント。
site_author: KAFKA2306
repo_url: https://github.com/KAFKA2306/agent-resources
repo_name: KAFKA2306/agent-resources

docs_dir: content
site_dir: site

theme:
  name: material
  palette:
    primary: black
    accent: deep orange
  font:
    code: Roboto Mono
  logo: images/puzzle.png
  features:
    - navigation.instant
    - navigation.tracking
    - toc.follow
    - content.code.copy
  custom_dir: overrides

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/KAFKA2306/agent-resources
      name: Software Factory Control Tower on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - meta

nav:
  - Home: index.md
  - Control Tower: control-tower.md
  - AGR CLI: cli.md
  - Creating Skills: creating.md
  - CLI Reference: reference.md
