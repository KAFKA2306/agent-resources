<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Resources Dashboard</title>
  <meta name="description" content="GitHub上の公開作業を一画面で確認するAgent Resources dashboard">
  <link rel="stylesheet" href="./dashboard.css">
  <link rel="stylesheet" href="./flow.css">
  <link rel="stylesheet" href="./game.css">
  <link rel="stylesheet" href="./stats.css">
  <script type="module" src="./flow.js"></script>
  <script type="module" src="./dashboard.js"></script>
</head>
<body class="game-dashboard">
  <header class="topbar">
    <div><p class="eyebrow">AGENT RESOURCES</p><h1>公開作業ダッシュボード</h1></div>
    <nav class="top-actions" aria-label="補助導線">
      <a class="home-link" href="../site/">CLI / Skills docs</a>
      <a class="home-link" href="https://github.com/KAFKA2306/agent-resources">Repository</a>
      <a class="home-link" href="https://pypi.org/project/agent-resources/">PyPI</a>
    </nav>
  </header>
  <div class="dashboard-shell">
    <main class="main-panel" aria-labelledby="workspace-title">
      <div class="world-decor" aria-hidden="true"><span class="decor-building"></span><span class="decor-sign">HUB</span><span class="decor-character"></span></div>
      <div class="panel-heading">
        <div><p class="eyebrow">WORKSPACE</p><h2 id="workspace-title">中央ハブ</h2></div>
        <div class="snapshot-meta">
          <span class="status-chip" id="snapshot-status" data-state="loading">読込中</span>
          <time id="snapshot-generated-at" class="snapshot-time">生成時刻: 読込中</time>
        </div>
      </div>
      <section class="hub" aria-label="中央ハブ"><strong>GitHub Public Hub</strong><span id="repository-count">0 repositories</span></section>
      <section class="github-stats" aria-labelledby="github-stats-title">
        <div class="stats-heading"><div><p class="eyebrow">PUBLIC GITHUB ACTIVITY</p><h2 id="github-stats-title">月次推移</h2></div><span id="stats-scope" class="stats-scope">public only</span></div>
        <div id="stats-summary" class="stats-summary" aria-label="GitHub活動サマリー"></div>
        <div class="stats-legend" aria-hidden="true"><span data-series="commits">Commit</span><span data-series="prsMerged">Merged PR</span><span data-series="issuesClosed">Closed Issue</span></div>
        <div id="stats-monthly" class="stats-monthly" role="table" aria-label="GitHub月次活動"></div>
        <p id="stats-note" class="stats-note muted"></p>
      </section>
      <section id="lane-flow" class="lane-flow" aria-label="work item の処理フロー"></section>
      <section id="lane-gates" class="lane-gates" aria-label="状態ゲート"></section>
      <section id="gate-detail" class="gate-detail" aria-live="polite" hidden></section>
      <section id="project-groups" class="project-groups" aria-live="polite"></section>
      <p id="workspace-message" class="muted workspace-message" hidden></p>
    </main>
    <aside class="sidebar" aria-labelledby="sidebar-title">
      <div class="panel-heading"><div><p class="eyebrow">SIDEBAR</p><h2 id="sidebar-title">最近の活動</h2></div></div>
      <div id="activity-feed" class="activity-feed" aria-live="polite"></div>
    </aside>
  </div>
</body>
</html>
