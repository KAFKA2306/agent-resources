<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Resources Dashboard</title>
  <meta name="description" content="GitHub上の公開作業を一画面で確認するAgent Resources dashboard">
  <link rel="stylesheet" href="./dashboard.css">
  <script type="module" src="./dashboard.js"></script>
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">AGENT RESOURCES</p>
      <h1>公開作業ダッシュボード</h1>
    </div>
    <a class="home-link" href="../">既存トップへ</a>
  </header>

  <div class="dashboard-shell">
    <main class="main-panel" aria-labelledby="workspace-title">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">WORKSPACE</p>
          <h2 id="workspace-title">中央ハブ</h2>
        </div>
        <span class="status-chip" id="snapshot-status">読込中</span>
      </div>

      <section class="hub" aria-label="中央ハブ">
        <strong>GitHub Public Hub</strong>
        <span id="repository-count">0 repositories</span>
      </section>

      <section id="project-groups" class="project-groups" aria-live="polite"></section>
      <p id="workspace-message" class="muted workspace-message" hidden></p>
    </main>

    <aside class="sidebar" aria-labelledby="sidebar-title">
      <div class="panel-heading">
        <div>
          <p class="eyebrow">SIDEBAR</p>
          <h2 id="sidebar-title">最近の活動</h2>
        </div>
      </div>
      <p class="muted">activity 表示は後続Issueで接続します。</p>
    </aside>
  </div>
</body>
</html>
